site_name: 大学物理
site_url: https://ducia.site/dxwl

nav:
  - 第一章  质点运动学: 1.md
  - 第二章  质点动力学: 2.md
  - 第三章  刚体力学基础: 3.md
  - 第四章  狭义相对论: 4.md
  - 第五章  机械振动: 5.md
  - 第六章  机械波: 6.md
  - 第七章  气体动理论基础: 7.md
  - 第八章  热力学基础: 8.md
  - 第九章  静电场: 9.md
  - 第十章  稳恒磁场: 10.md
  - 第十一章  变化的电磁场: 11.md
  - 第十二章  光的干涉: 12.md
  - 第十三章  光的衍射: 13.md
  - 第十四章  光的偏振: 14.md
  - 第十五章  量子物理基础: 15.md
  - 第十六章  原子核物理和粒子物理简介: 16.md
  - 第十七章  新技术的物理基础: 17.md

theme:
  name: material
  palette:
    # 亮色模式
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # 深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.integrate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - attr_list

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
